{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "theWAY Media",
  "alternateName": "theWAY MEDIA",
  "url": "https://wayism.net",
  "logo": "{{ "/images/theway-media-logo.png" | absURL }}",
  "description": "{{ .Site.Params.description }}",
  "parentOrganization": {
    "@type": "Organization",
    "name": "El Camino de Caminismo Universal, Asociación Civil",
    "alternateName": "Caminismo A.C.",
    "url": "https://caminismo.org"
  }
}
</script>
{{ else if eq .Section "books" }}
{{ if .Params.authors }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": {{ .Title }},
  "author": [{{ range $i, $a := .Params.authors }}{{ if $i }},{{ end }}{ "@type": "Person", "name": {{ $a }} }{{ end }}],
  {{ with .Params.isbn_paperback }}"isbn": {{ . }},{{ end }}
  "publisher": { "@type": "Organization", "name": "theWAY Media", "url": "https://wayism.net" },
  "description": {{ .Summary | plainify }}
}
</script>
{{ end }}
{{ else if eq .Section "songs" }}
{{ if .Params.artist }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicRecording",
  "name": {{ .Title }},
  "byArtist": { "@type": "MusicGroup", "name": {{ .Params.artist }} },
  {{ with .Params.lyricist }}"lyricist": { "@type": "Person", "name": {{ . }} },{{ end }}
  {{ with .Params.album }}"inAlbum": { "@type": "MusicAlbum", "name": {{ . }} },{{ end }}
  "publisher": { "@type": "Organization", "name": "theWAY Media", "url": "https://wayism.net" }
}
</script>
{{ end }}
{{ end }}
