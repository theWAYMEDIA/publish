{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "theWAY Media",
  "alternateName": "theWAY MEDIA",
  "url": "https://wayism.net",
  "logo": "{{ "/images/theway-media-logo.png" | absURL }}",
  "description": "{{ .Site.Params.description }}",
  "parentOrganization": {
    "@type": "Organization",
    "name": "El Camino de Caminismo Universal, Asociación Civil",
    "alternateName": "Caminismo A.C.",
    "url": "https://caminismo.org"
  }
}
</script>
{{ else if eq .Section "books" }}
{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": {{ .Title | jsonify }},
  "author": [{{ range $i, $a := .Params.authors }}{{ if $i }},{{ end }}{ "@type": "Person", "name": {{ $a | jsonify }} }{{ end }}],
  {{ with .Params.isbn_paperback }}"isbn": {{ . | jsonify }},{{ end }}
  "description": {{ .Summary | plainify | jsonify }}
}
</script>
{{ end }}
{{ end }}
