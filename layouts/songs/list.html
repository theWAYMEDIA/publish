{{ define "main" }}
<div class="books-page">
  {{ if not (strings.HasPrefix (strings.TrimSpace .Content) "<h1") }}<h1>{{ .Title }}</h1>{{ end }}
  {{ .Content }}

  <div class="books-grid">
    {{ range .Pages.ByTitle }}
    <div class="book-card">
      <h3><a href="{{ .Permalink }}">{{ .Title }}</a>{{ with .Params.vocalist }} <span class="book-card-vocalist">(feat. {{ . }})</span>{{ end }}</h3>
      {{ if .Params.artist }}
      <p class="book-card-author"><a href="{{ printf "artists/%s/" .Params.artist_slug | relURL }}">{{ .Params.artist }}</a></p>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
